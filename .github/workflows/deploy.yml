name: CI/CD

on:
  push:
    branches:
      - main
      - codex/**
      - feat/**
      - fix/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    environment: main_deploy
    env:
      DEPLOY_HOST: ${{ secrets.HOST || vars.HOST }}
      DEPLOY_PORT: ${{ secrets.PORT || vars.PORT || '22' }}
      DEPLOY_USER: ${{ secrets.USER || vars.USER }}
      DEPLOY_PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
      DEPLOY_PATH: /root/rexileer-dev
      DEPLOY_REF: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate deploy environment
        run: |
          : "${DEPLOY_HOST:?HOST is required}"
          : "${DEPLOY_PORT:?PORT is required}"
          : "${DEPLOY_USER:?USER is required}"
          : "${DEPLOY_PASSWORD:?PASSWORD is required}"

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote host
        env:
          SSHPASS: ${{ env.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<REMOTE
          set -eu
          mkdir -p "$DEPLOY_PATH"
          git config --global --add safe.directory "$DEPLOY_PATH" || true
          REMOTE

      - name: Rebuild and verify
        env:
          SSHPASS: ${{ env.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -eu
          cd /root/rexileer-dev

          git reset --hard
          git clean -fd -e AGENTS.md -e agents.md -e ai-context/
          git fetch origin "$DEPLOY_REF"
          git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
          git reset --hard "$DEPLOY_SHA"
          git clean -fd -e AGENTS.md -e agents.md -e ai-context/

          mkdir -p .git/info
          grep -qxF 'AGENTS.md' .git/info/exclude || echo 'AGENTS.md' >> .git/info/exclude
          grep -qxF 'agents.md' .git/info/exclude || echo 'agents.md' >> .git/info/exclude
          grep -qxF 'ai-context/' .git/info/exclude || echo 'ai-context/' >> .git/info/exclude

          docker compose up -d --build --remove-orphans

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose logs --tail=200
          exit 1
          REMOTE
