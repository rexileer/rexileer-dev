name: CI/CD

on:
  push:
    branches:
      - main
      - codex/**
      - feat/**
      - fix/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

  verify:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare ephemeral verification key
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          key_file = Path(os.environ["RUNNER_TEMP"]) / "django-signing.key"
          key_file.write_text(secrets.token_urlsafe(64), encoding="utf-8")
          key_file.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DJANGO_SECRET_KEY_FILE={key_file}\n")
          PY
      - name: Install application dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Django
        run: python backend/manage.py check
      - name: Check migration consistency
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Check JavaScript syntax
        run: |
          node --check site/script.js
          node --check site/assets/js/lab-model.mjs
          node --check site/assets/js/process-lab.mjs
      - name: Check deterministic process models
        run: node --test tests/lab-model.test.mjs
      - name: Collect static assets
        run: python backend/manage.py collectstatic --noinput
      - name: Run existing tests
        run: python backend/manage.py test core

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, verify]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: rexileer-production
      cancel-in-progress: false
    environment: main_deploy
    env:
      DEPLOY_HOST: ${{ secrets.HOST || vars.HOST }}
      DEPLOY_PORT: ${{ secrets.PORT || vars.PORT || '22' }}
      DEPLOY_USER: ${{ secrets.USER || vars.USER }}
      DEPLOY_PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
      DEPLOY_PATH: /root/rexileer-dev
      DEPLOY_REF: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL || 'gpt-4o-mini' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate deploy environment
        run: |
          : "${DEPLOY_HOST:?HOST is required}"
          : "${DEPLOY_PORT:?PORT is required}"
          : "${DEPLOY_USER:?USER is required}"
          : "${DEPLOY_PASSWORD:?PASSWORD is required}"

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote host
        env:
          SSHPASS: ${{ env.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<REMOTE
          set -eu
          mkdir -p "$DEPLOY_PATH"
          git config --global --add safe.directory "$DEPLOY_PATH" || true
          REMOTE

      - name: Rebuild and verify
        env:
          SSHPASS: ${{ env.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -eu
          cd /root/rexileer-dev

          git reset --hard
          git clean -fd -e AGENTS.md -e agents.md -e ai-context/ -e .env
          git fetch origin "$DEPLOY_REF"
          git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
          git reset --hard "$DEPLOY_SHA"
          git clean -fd -e AGENTS.md -e agents.md -e ai-context/ -e .env

          mkdir -p .git/info
          grep -qxF 'AGENTS.md' .git/info/exclude || echo 'AGENTS.md' >> .git/info/exclude
          grep -qxF 'agents.md' .git/info/exclude || echo 'agents.md' >> .git/info/exclude
          grep -qxF 'ai-context/' .git/info/exclude || echo 'ai-context/' >> .git/info/exclude

          docker compose config --quiet
          docker compose up -d --build --remove-orphans

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              docker compose ps
              install -m 0644 ops/rexileer-analytics-prune.service /etc/systemd/system/
              install -m 0644 ops/rexileer-analytics-prune.timer /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable --now rexileer-analytics-prune.timer
              systemctl is-active --quiet rexileer-analytics-prune.timer
              exit 0
            fi
            sleep 2
          done

          docker compose logs --tail=200
          exit 1
          REMOTE
