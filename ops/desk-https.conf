# Managed by rexileer-dev: isolated Desk only.
map $uri $desk_login_key {
    default "";
    /login/ $binary_remote_addr;
}
limit_req_zone $desk_login_key zone=desk_login:1m rate=1r/s;
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desk.rexileer.ru;
    ssl_certificate /etc/letsencrypt/live/desk.rexileer.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.rexileer.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;
    access_log off;
    error_log /var/log/nginx/desk-error.log crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /health/ { return 404; }
    location / {
        limit_req zone=desk_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host desk.rexileer.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }
}
