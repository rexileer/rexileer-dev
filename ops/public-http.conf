# Managed by rexileer-dev: public portfolio only.
server {
    listen 80;
    listen [::]:80;
    server_name rexileer.tech www.rexileer.tech;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://rexileer.tech$request_uri; }
}
