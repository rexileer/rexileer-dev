# Managed by rexileer-dev: AI Leads at its new domain.
server {
    listen 80;
    listen [::]:80;
    server_name ai-leads.rexileer.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 301 https://ai-leads.rexileer.tech$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-leads.rexileer.tech;
    ssl_certificate /etc/letsencrypt/live/ai-leads.rexileer.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-leads.rexileer.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host ai-leads.rexileer.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
