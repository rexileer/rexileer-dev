# Managed by rexileer-dev: authenticated logs at their new domain.
map $http_upgrade $tech_logs_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name logs.rexileer.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 301 https://logs.rexileer.tech$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logs.rexileer.tech;
    ssl_certificate /etc/letsencrypt/live/logs.rexileer.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.rexileer.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-logs;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tech_logs_connection;
        proxy_set_header Host logs.rexileer.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
