# Managed by rexileer-dev: public portfolio only.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rexileer.tech;
    ssl_certificate /etc/letsencrypt/live/rexileer.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rexileer.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://rexileer.tech$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rexileer.tech;
    ssl_certificate /etc/letsencrypt/live/rexileer.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rexileer.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host rexileer.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
